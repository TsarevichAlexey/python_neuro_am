<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфель Tinkoff</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { margin-bottom: 10px; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px; cursor: pointer; border-bottom: 1px solid #ddd; }
    li:hover { background: #f5f5f5; }
    .security-item span { display: inline-block; min-width: 100px; }
    .security-item .name { min-width: 250px; }
    .security-item .pl.positive { color: green; }
    .security-item .pl.negative { color: red; }
    #chart-container { margin-top: 20px; }
    #total-value { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Мой портфель</h1>
  <div id="total-value">Общая стоимость: ...</div>
  <ul id="securities"></ul>
  <div id="chart-container">
    <canvas id="candleChart"></canvas>
  </div>

  <script>
    const evtSource = new EventSource('/portfolio/stream');
    const listEl = document.getElementById('securities');
    const totalValueEl = document.getElementById('total-value');
    let chart;

    evtSource.onmessage = (e) => {
      console.log("Received SSE:", e.data); // Для отладки
      const msg = JSON.parse(e.data);
      if (msg.type === 'initial') {
        listEl.innerHTML = ''; // Очищаем список перед заполнением
        const portfolioData = msg.data; // msg.data содержит {positions: [...], total: ...}

        if (portfolioData && portfolioData.positions) {
          portfolioData.positions.forEach(s => { // Используем portfolioData.positions
            const li = document.createElement('li');
            li.classList.add('security-item');
            // Отображаем больше информации
            li.innerHTML = `
              <span class="ticker">${s.ticker}</span>
              <span class="name">${s.name}</span>
              <span class="quantity">Кол-во: ${s.quantity}</span>
              <span class="avg-price">Средняя: ${s.avg_price.toFixed(2)}</span>
              <span class="curr-price">Текущая: ${s.curr_price.toFixed(2)}</span>
              <span class="value">Стоимость: ${s.value.toFixed(2)}</span>
              <span class="pl ${s.pl >= 0 ? 'positive' : 'negative'}">P/L: ${s.pl.toFixed(2)}</span>
            `;
            li.dataset.figi = s.figi; // FIGI для загрузки свечей
            li.dataset.ticker = s.ticker; // Ticker для заголовка графика
            li.addEventListener('click', () => loadCandles(s.figi, s.ticker));
            listEl.appendChild(li);
          });
          totalValueEl.textContent = `Общая стоимость портфеля: ${portfolioData.total.toFixed(2)}`;
        } else {
          console.error("Получены некорректные данные 'initial':", msg);
        }

      } else if (msg.type === 'update') {
        // Этот блок пока не используется, так как бэкенд шлет только 'initial'
        const updated = msg.data;
        const item = Array.from(listEl.children)
          .find(li => li.dataset.figi === updated.figi);
        if (item) {
          // Обновите содержимое li здесь, если бэкенд будет слать 'update'
          // Например:
          // item.querySelector('.quantity').textContent = `Кол-во: ${updated.quantity}`;
          // item.querySelector('.curr-price').textContent = `Текущая: ${updated.curr_price.toFixed(2)}`;
          // ... и так далее для всех полей
          console.log("Получено обновление (не обработано):", updated);
        }
      }
    };

    evtSource.onerror = (err) => {
        console.error("EventSource failed:", err);
        evtSource.close(); // Можно закрыть, чтобы не пытаться переподключаться бесконечно
    };

    async function loadCandles(figi, ticker) { // Добавим ticker для заголовка
      try {
        const resp = await fetch(`/candles?figi=${figi}&days=30`); // Увеличим дни для наглядности
        if (!resp.ok) {
            const errorData = await resp.json();
            throw new Error(`Ошибка сервера: ${resp.status} - ${errorData.detail || resp.statusText}`);
        }
        const data = await resp.json();
        if (!Array.isArray(data) || data.length === 0) {
            console.warn("Нет данных по свечам для", figi);
            if (chart) chart.destroy(); // Очищаем старый график, если нет новых данных
            document.getElementById('candleChart').getContext('2d').clearRect(0,0,document.getElementById('candleChart').width,document.getElementById('candleChart').height); // Очищаем canvas
            return;
        }
        const labels = data.map(c => new Date(c.time).toLocaleDateString()); // Более читаемый формат даты
        const closes = data.map(c => c.close);
        const ctx = document.getElementById('candleChart').getContext('2d');

        if (chart) {
          chart.destroy();
        }

        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: `Цена закрытия ${ticker || figi}`, // Используем ticker
              data: closes,
              fill: false,
              borderColor: 'rgb(75, 192, 192)',
              tension: 0.1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { display: true, title: { display: true, text: 'Дата' } },
              y: { display: true, title: { display: true, text: 'Цена' } }
            }
          }
        });
      } catch (err) {
        console.error('Ошибка при загрузке свечей:', err);
        alert(`Не удалось загрузить свечи: ${err.message}`);
      }
    }
  </script>
</body>
</html>
